version: 1

sampling:
  frequency_hz: 15
  timestamp_key: timestamp

action:
  key: action
  dim: 7
  space: end_effector
  mode: delta
  coordinate_frame: unknown
  position_unit: meter
  rotation:
    representation: rotation_vector
  arms:
    single:
      position: [0, 1, 2]
      orientation: [3, 4, 5]
      gripper: [6]

state:
  key: observation.state
  dim: 14
  joint_position_unit: radian
  arms:
    single:
      joint_position: [0, 1, 2, 3, 4, 5]
      gripper: [12]

gripper:
  action:
    representation: binary_command
    open_value: 0
    closed_value: 1
  state:
    representation: normalized_position
    open_value: 1
    closed_value: 0

quality:
  activity_thresholds:
    translation_speed: 0.005
    rotation_speed: 0.05
    joint_speed: 0.05
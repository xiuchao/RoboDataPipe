DEM_handposition:
  embodiment: aibot2
  repo_id: alphabot2/aibot2_2026-07-07_hand_position_donothing
  root: /data/xiuchao/biArm/DEM/data_DEM/hand_postion_donothing/
  contract: contracts/dem_pickplace.yaml
  cameras:
    - observation.images.camera_1
    - observation.images.camera_2

DEM_pickplace:
  embodiment: aibot2
  repo_id: alphabot2/aibot2_2026-07-07_hand_position_pick_and_place
  root: /data/xiuchao/biArm/DEM/data_DEM/hand_position_pick_and_place/
  contract: contracts/dem_pickplace.yaml
  signal_source: action

  retreat:
    source: action
    window: 5
    displacement_threshold: 0.01

  release:
    gripper_source: observation.state
    stationary_window: 1
    stationary_displacement_threshold: 0.01
    open_tolerance: 0.05

  cameras:
    top: observation.images.camera_top
    left: observation.images.camera_right
    right: observation.images.camera_left
    global:
      - observation.images.camera_top
      - observation.images.camera_front


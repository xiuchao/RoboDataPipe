DSRFM_easy:
  robot_type: ur5
  repo_id: ases200q2/UR5_RTDE_SpaceMouse_EE_pick_and_place_object_Easy_filtered
  root: /data/xiuchao/biArm/DEM/data_DSRFM/ur5_easy_filtered
  signal_source: action
  gripper_dim: -1
  direction: increase
  cameras:
    - observation.images.camera_1
    - observation.images.camera_2
  default_camera: 

DSRFM_v3:
  robot_type: ur5
